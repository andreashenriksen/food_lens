name: food_lens
description: >-
  Calorie and nutrition tracker for Norwegian groceries. Scans barcodes,
  resolves them against the Kassalapp product index, and keeps the diary
  in local SQLite.
repository: https://github.com/andreashenriksen/food_lens
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # The API key lives in the platform keystore; everything else in prefs.
  flutter_secure_storage: ^11.0.0
  # Product lookup.
  http: ^1.6.0
  intl: 0.20.2
  mobile_scanner: ^7.4.0
  path: ^1.9.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  # Local storage: the native plugin on mobile, FFI on desktop, WASM on web.
  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.4.2
  sqflite_common_ffi_web: ^1.1.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
