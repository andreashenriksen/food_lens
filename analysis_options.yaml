include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # Anything the analyzer can flag should fail CI, so these are errors
    # rather than hints that scroll past.
    unused_import: error
    unused_local_variable: error
    dead_code: error
    todo: ignore

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - directives_ordering
    - prefer_final_locals
    - prefer_relative_imports
    - prefer_single_quotes
    - require_trailing_commas
    - sort_pub_dependencies
    - throw_in_finally
    - unawaited_futures
    - unnecessary_parenthesis
    - use_super_parameters
